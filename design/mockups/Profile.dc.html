<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Plant profile</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:wght@600;700&display=swap">
<style>
body{margin:0;background:#ffffff}
a{color:#1c7293}a:hover{color:#0b2e3f}
select{font-family:inherit}
</style>
</helmet>
<div style="box-sizing: border-box; max-width: 1440px; margin: 0 auto; padding: 0 32px 40px; background: #ffffff; color: #1e2a24; font-family: Calibri, 'Source Sans 3', 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 21px">
<dc-import name="Nav" current="profile" hint-size="100%,64px"></dc-import>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; padding: 18px 0 16px">
<h1 style="margin: 0; font-family: Cambria, 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 30px; line-height: 36px; color: #17362a">Plant profile</h1>
<label style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: #5e6b64">Plant
<select style="min-height: 44px; padding: 0 12px; border: 1px solid #8a959c; border-radius: 8px; background: #ffffff; color: #17362a; font-size: 15px; font-weight: 700">
<option>W2 H5</option><option>W2 A8</option><option>W2 R7</option><option>W3 B7</option><option>W1 J5</option>
</select>
</label>
<span style="padding: 2px 8px; border-radius: 4px; background: #fbf1de; color: #5a3e00; font-size: 12px; font-weight: 700; letter-spacing: 0.12em">WATER DEFICIT</span>
<span style="padding: 2px 8px; border-radius: 4px; border: 1px solid #8a959c; font-size: 12px">leaf clip</span>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<main style="flex: 999 1 640px; min-width: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 12px">
<sc-for list="{{panels}}" as="p" hint-placeholder-count="5">
<section aria-label="{{p.label}}" style="border: 1px solid #cfe0d4; border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: baseline; gap: 8px">
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.1em; color: #4a565d; width: 30px">{{p.src}}</span>
<span style="flex: 1 1 auto; font-weight: 700">{{p.label}}</span>
<span style="font-family: Cambria, 'Source Serif 4', Georgia, serif; font-size: 24px; line-height: 28px; font-weight: 700; color: #17362a">{{p.last}}</span>
<span style="font-size: 13px; color: #5e6b64; width: 30px">{{p.unit}}</span>
</div>
<div role="img" aria-label="{{p.aria}}" style="display: flex; gap: 3px">
<sc-for list="{{p.bars}}" as="b" hint-placeholder-count="18">
<div title="{{b.tip}}" style="flex: 1 1 0; display: flex; flex-direction: column; background: {{b.band}}">
<div style="height: 60px; display: flex; align-items: flex-end"><div style="width: 100%; height: {{b.up}}; background: {{b.bg}}"></div></div>
<div style="height: 1px; background: #5e6b64"></div>
<div style="height: 30px"><div style="width: 100%; height: {{b.down}}; background: {{b.bg}}"></div></div>
<div style="height: 4px; background: {{b.mark}}"></div>
</div>
</sc-for>
</div>
</section>
</sc-for>
<section aria-label="Spectrum" style="border: 2px dashed #cfe0d4; border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 120px; color: #5e6b64">
<span style="font-size: 11px; font-weight: 700; letter-spacing: 0.1em">HSI</span><span style="font-weight: 700">Spectrum</span><span>· no table yet</span>
</section>
</main>

<aside aria-label="Events" style="flex: 1 1 300px; max-width: 380px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<div style="padding: 16px; border-radius: 12px; background: #fbf1de; display: flex; align-items: center; gap: 14px">
<span aria-hidden="true" style="width: 34px; height: 34px; display: inline-flex; align-items: center; justify-content: center; background: #ffffff; border-radius: 8px"><span style="width: 19px; height: 19px; background: #5a3e00; border-radius: 2px; transform: rotate(45deg)"></span></span>
<div><div style="font-family: Cambria, 'Source Serif 4', Georgia, serif; font-size: 24px; line-height: 28px; font-weight: 700; color: #17362a">Irrigate</div><div style="font-size: 13px; color: #5a3e00">since day 3</div></div>
</div>
<ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; border-left: 2px solid #cfe0d4; margin-left: 8px">
<sc-for list="{{events}}" as="e" hint-placeholder-count="5">
<li style="position: relative; padding: 6px 0 14px 18px">
<span aria-hidden="true" style="position: absolute; left: -7px; top: 10px; width: 12px; height: 12px; border-radius: 999px; background: {{e.dot}}; border: 2px solid #ffffff"></span>
<div style="font-family: Cambria, 'Source Serif 4', Georgia, serif; font-size: 19px; line-height: 24px; font-weight: 700; color: {{e.fc}}">{{e.when}}</div>
<div style="font-size: 13px; color: #4a565d">{{e.what}}</div>
</li>
</sc-for>
</ol>
<div style="padding: 12px 14px; border-radius: 12px; border: 2px dashed #cfe0d4; display: flex; align-items: baseline; gap: 8px; color: #5e6b64">
<span style="font-weight: 700">Stress probability</span><span>· no table yet</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<a href="Browser3D.dc.html" style="min-height: 44px; display: inline-flex; align-items: center; padding: 0 16px; border-radius: 8px; background: #1c7293; color: #ffffff; font-weight: 700; text-decoration: none">3D browser</a>
<a href="Main.dc.html" style="min-height: 44px; display: inline-flex; align-items: center; padding: 0 16px; border-radius: 8px; border: 1px solid #1c7293; color: #1c7293; font-weight: 700; text-decoration: none; box-sizing: border-box">Bed map</a>
</div>
</aside>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
renderVals() {
const P = [
  ['CLIP', 'Leaf-clip shift', 'raw', [null,null,null,-3.8,-2.7,9.9,4.7,8.9,7.9,3.7,13.6,9.3,12.1,14.2,23.7,19.5,23.2,31.7], 1, '#5a3e00', '#1c7293'],
  ['IR', 'Thermal score', 'z', [null,-0.6,null,1.2,0.1,2.1,3.0,3.5,3.7,null,null,4.8,null,6.4,null,5.7,7.0,1.1], 1, '#5a3e00', '#1c7293'],
  ['IR', 'Leaf − control leaf', '°C', [-1.1,-0.2,-0.1,1.4,1.2,1.4,1.5,1.8,4.7,2.8,3.4,4.3,7.9,6.1,4.0,9.1,9.5,1.7], 1, '#c98300', '#3f7f93'],
  ['3D', 'Projected area', '%', [-3,-10,23,null,38,20,16,49,-6,-17,-17,-12,-51,-40,-43,-63,-60,null], 0, '#3f7f93', '#c98300'],
  ['3D', 'Height p75', '%', [-2,-4,11,null,9,10,20,47,49,39,34,49,36,51,32,-19,6,null], 0, '#3f7f93', '#c98300'],
];
const dateOf = (i) => (i < 2 ? (30 + i) + ' Aug' : (i - 1) + ' Sep');
const sgn = (v, dp) => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(dp);
const panels = P.map(([src, label, unit, s, dp, upC, downC]) => {
  const max = Math.max(...s.filter((v) => v != null).map(Math.abs));
  const lastI = s.map((v, i) => (v == null ? -1 : i)).filter((i) => i >= 0).pop();
  return {
    src, label, unit, last: sgn(s[lastI], dp),
    aria: label + ', W2 H5, 30 Aug to 16 Sep',
    bars: s.map((v, i) => {
      const h = v == null ? 0 : Math.max(2, (Math.abs(v) / max) * 60), n = i - 4;
      return { up: v != null && v >= 0 ? h + 'px' : '0px', down: v != null && v < 0 ? Math.min(30, h) + 'px' : '0px', bg: v == null ? 'transparent' : v >= 0 ? upC : downC,
        band: n < 0 ? '#eef4ee' : n <= 12 ? '#fbf1de' : '#f6f8f9', mark: i === 7 ? '#0b2e3f' : 'transparent', tip: 'Day ' + n + ' · ' + dateOf(i) + ': ' + (v == null ? 'no scan' : sgn(v, dp) + ' ' + unit) };
    }),
  };
});
return {
  panels,
  events: [
    { when: 'day 1', what: 'clip onset · 4 Sep', dot: '#c98300', fc: '#17362a' },
    { when: 'day 3', what: 'first irrigate flag · 09 h', dot: '#5a3e00', fc: '#17362a' },
    { when: 'day 4', what: 'area below baseline', dot: '#3f7f93', fc: '#17362a' },
    { when: '–', what: 'written symptom', dot: '#cfe0d4', fc: '#5e6b64' },
    { when: '–', what: 'RWC sample', dot: '#cfe0d4', fc: '#5e6b64' },
  ],
};
}
}
</script>
</body>
</html>
