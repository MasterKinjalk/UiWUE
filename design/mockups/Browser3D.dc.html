<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>3D browser</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&family=Source+Serif+4:wght@600;700&display=swap">
<style>
body{margin:0;background:#ffffff}
a{color:#1c7293}a:hover{color:#0b2e3f}
button,select{font-family:inherit}
button:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid #0b2e3f;outline-offset:2px}
</style>
</helmet>
<div style="box-sizing: border-box; max-width: 1440px; margin: 0 auto; padding: 0 32px 40px; background: #ffffff; color: #1e2a24; font-family: Calibri, 'Source Sans 3', 'Segoe UI', system-ui, sans-serif; font-size: 15px; line-height: 21px">
<dc-import name="Nav" current="3d" hint-size="100%,64px"></dc-import>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 18px 0 16px">
<h1 style="margin: 0; font-family: Cambria, 'Source Serif 4', Georgia, serif; font-weight: 700; font-size: 30px; line-height: 36px; color: #17362a">3D browser</h1>
<label style="display: inline-flex; align-items: center; gap: 8px; font-size: 13px; color: #5e6b64">Plant
<select style="min-height: 44px; padding: 0 12px; border: 1px solid #8a959c; border-radius: 8px; background: #ffffff; color: #17362a; font-size: 15px; font-weight: 700">
<option>W2 A8</option><option>W2 H5</option><option>W2 R7</option><option>W1 J5</option><option>W1 R1</option>
</select>
</label>
<span style="padding: 2px 8px; border-radius: 4px; background: #fbf1de; color: #5a3e00; font-size: 12px; font-weight: 700; letter-spacing: 0.12em">WATER DEFICIT</span>
<div style="flex: 1 1 0"></div>
<div role="group" aria-label="Colour by" style="display: flex; gap: 4px">
<sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
<button type="button" aria-pressed="{{m.on}}" disabled="{{m.off}}" onClick="{{m.pick}}" title="{{m.tip}}" style="min-height: 44px; padding: 0 16px; border: 1px solid {{m.bd}}; border-radius: 8px; background: {{m.bg}}; color: {{m.fg}}; font-size: 15px; font-weight: 700; cursor: pointer">{{m.label}}</button>
</sc-for>
</div>
<button type="button" aria-pressed="{{compare}}" onClick="{{toggleCompare}}" style="min-height: 44px; padding: 0 16px; border: 1px solid {{cmpBd}}; border-radius: 8px; background: {{cmpBg}}; color: {{cmpFg}}; font-size: 15px; font-weight: 700; cursor: pointer">Compare</button>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">
<main style="flex: 999 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 16px">

<div style="display: grid; grid-template-columns: {{cols}}; gap: 12px">
<sc-for list="{{views}}" as="v" hint-placeholder-count="2">
<section aria-label="{{v.aria}}" style="border: 1px solid #cfe0d4; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 10px 14px; background: {{v.tint}}">
<span style="width: 28px; height: 28px; border-radius: 999px; background: #0b2e3f; color: #ffffff; font-family: Cambria, 'Source Serif 4', Georgia, serif; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">{{v.tag}}</span>
<span style="font-family: Cambria, 'Source Serif 4', Georgia, serif; font-size: 21px; line-height: 26px; font-weight: 700; color: #17362a">{{v.day}}</span>
<span style="font-size: 13px; color: #5e6b64">{{v.date}}</span>
<div style="flex: 1 1 0"></div>
<div role="group" aria-label="Hour" style="display: flex; gap: 2px">
<sc-for list="{{v.hours}}" as="h" hint-placeholder-count="6">
<span style="min-width: 30px; height: 30px; padding: 0 4px; box-sizing: border-box; border-radius: 4px; border: 1px solid {{h.bd}}; background: {{h.bg}}; color: {{h.fg}}; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center">{{h.h}}</span>
</sc-for>
</div>
</div>
<img src="{{v.img}}" alt="{{v.alt}}" style="display: block; width: 100%; aspect-ratio: 630 / 559; object-fit: contain; background: #ffffff">
<div style="display: flex; gap: 16px; padding: 8px 14px; border-top: 1px solid #cfe0d4; font-size: 13px; color: #5e6b64">
<span>{{v.pts}}</span><span>{{v.plantPts}}</span>
</div>
</section>
</sc-for>
</div>

<sc-if value="{{showRamp}}" hint-placeholder-val="{{true}}">
<div style="display: flex; align-items: center; gap: 10px; font-size: 13px; color: #5e6b64">
<span>0</span>
<span aria-hidden="true" style="width: 220px; height: 12px; border-radius: 4px; background: linear-gradient(90deg, #cfe3c9, #8db57a, #2e6b4f, #17362a)"></span>
<span>130 mm</span>
<span style="display: inline-flex; align-items: center; gap: 6px; margin-left: 12px"><span aria-hidden="true" style="width: 12px; height: 12px; border-radius: 999px; background: #d5dcd8"></span>soil, pot</span>
</div>
</sc-if>

<section aria-label="Height over time" style="border: 1px solid #cfe0d4; border-radius: 12px; padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px">
<span style="font-weight: 700">Height p75</span>
<span style="font-size: 13px; color: #5e6b64">mm</span>
<div style="flex: 1 1 0"></div>
<div role="group" aria-label="Hour line" style="display: flex; gap: 2px">
<sc-for list="{{hourBtns}}" as="b" hint-placeholder-count="5">
<button type="button" aria-pressed="{{b.on}}" onClick="{{b.pick}}" style="min-width: 44px; min-height: 36px; border: 1px solid {{b.bd}}; border-radius: 4px; background: {{b.bg}}; color: {{b.fg}}; font-size: 13px; font-weight: 700; cursor: pointer">{{b.h}} h</button>
</sc-for>
</div>
<span style="display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: #5e6b64"><span aria-hidden="true" style="font-weight: 700; color: #8a959c">×</span>QC failed</span>
</div>
<div style="position: relative; height: 240px">
<svg viewBox="0 0 900 220" preserveAspectRatio="none" role="img" aria-label="{{chartAria}}" style="position: absolute; left: 0; top: 0; width: 100%; height: 220px; overflow: visible">
<rect x="16" y="8" width="192" height="196" fill="#eef4ee"></rect>
<rect x="208" y="8" width="637" height="196" fill="#fbf1de"></rect>
<path d="M16 200 H884 M16 142.5 H884 M16 85 H884 M16 27.5 H884" stroke="#cfe0d4" stroke-width="1" vector-effect="non-scaling-stroke" fill="none"></path>
<path d="{{others}}" stroke="#8a959c" stroke-width="1.25" vector-effect="non-scaling-stroke" fill="none"></path>
<path d="{{fails}}" stroke="#8a959c" stroke-width="1.5" vector-effect="non-scaling-stroke" fill="none"></path>
<path d="M184 8 V204 M712 8 V204" stroke="#0b2e3f" stroke-width="1.5" stroke-dasharray="3 3" vector-effect="non-scaling-stroke" fill="none"></path>
<path d="{{sel}}" stroke="#1c7293" stroke-width="2.5" vector-effect="non-scaling-stroke" fill="none"></path>
<path d="{{selDots}}" stroke="#1c7293" stroke-width="7" stroke-linecap="round" vector-effect="non-scaling-stroke" fill="none"></path>
</svg>
<span style="position: absolute; left: 0; top: 190px; font-size: 12px; color: #5e6b64">0</span>
<span style="position: absolute; left: 0; top: 75px; font-size: 12px; color: #5e6b64">100</span>
<span style="position: absolute; left: 20.4%; top: 0; width: 20px; height: 20px; border-radius: 999px; background: #0b2e3f; color: #ffffff; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; transform: translate(-50%, -6px)">A</span>
<span style="position: absolute; left: 79.1%; top: 0; width: 20px; height: 20px; border-radius: 999px; background: #0b2e3f; color: #ffffff; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; transform: translate(-50%, -6px)">B</span>
<span style="position: absolute; left: 4.4%; top: 222px; font-size: 12px; color: #5e6b64; transform: translateX(-50%)">−4</span>
<span style="position: absolute; left: 25.8%; top: 222px; font-size: 12px; color: #5e6b64; transform: translateX(-50%)">0</span>
<span style="position: absolute; left: 47.1%; top: 222px; font-size: 12px; color: #5e6b64; transform: translateX(-50%)">4</span>
<span style="position: absolute; left: 68.4%; top: 222px; font-size: 12px; color: #5e6b64; transform: translateX(-50%)">8</span>
<span style="position: absolute; left: 89.8%; top: 222px; font-size: 12px; color: #5e6b64; transform: translateX(-50%)">12</span>
</div>
</section>
</main>

<aside aria-label="Traits" style="flex: 1 1 320px; max-width: 420px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<div style="border: 1px solid #cfe0d4; border-radius: 12px; overflow: hidden">
<table style="width: 100%; border-collapse: collapse; font-size: 14px; line-height: 20px">
<thead>
<tr style="background: #0b2e3f; color: #ffffff">
<th scope="col" style="text-align: left; padding: 8px 12px; font-size: 13px">Trait</th>
<th scope="col" style="text-align: right; padding: 8px 6px; font-size: 13px">A</th>
<th scope="col" style="text-align: right; padding: 8px 6px; font-size: 13px">B</th>
<th scope="col" style="text-align: right; padding: 8px 12px; font-size: 13px">Δ</th>
</tr>
</thead>
<tbody>
<sc-for list="{{traits}}" as="t" hint-placeholder-count="7">
<tr style="border-bottom: 1px solid #cfe0d4">
<th scope="row" title="{{t.tip}}" style="text-align: left; padding: 8px 12px; font-weight: 400">{{t.label}} <span style="color: #5e6b64; font-size: 12px">{{t.unit}}</span></th>
<td title="{{t.madA}}" style="text-align: right; padding: 8px 6px; font-variant-numeric: tabular-nums">{{t.a}}</td>
<td title="{{t.madB}}" style="text-align: right; padding: 8px 6px; font-variant-numeric: tabular-nums">{{t.b}}</td>
<td style="text-align: right; padding: 8px 12px; font-weight: 700; color: {{t.dc}}; font-variant-numeric: tabular-nums">{{t.d}}</td>
</tr>
</sc-for>
</tbody>
</table>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<figure style="margin: 0; display: flex; flex-direction: column; gap: 4px">
<img src="/_blob/361a079d0c228b541c305648daec02e0" alt="RGB frame 7, W2 A8, 2 Sep 15 h" style="width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px">
<figcaption style="display: flex; gap: 6px; align-items: center; font-size: 12px; color: #5e6b64"><span style="font-weight: 700; color: #0b2e3f">A</span>frame 7</figcaption>
</figure>
<figure style="margin: 0; display: flex; flex-direction: column; gap: 4px">
<img src="/_blob/c7ce4721c5e39931d4a7c75986ed65c6" alt="RGB frame 7, W2 A8, 13 Sep 15 h" style="width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 8px">
<figcaption style="display: flex; gap: 6px; align-items: center; font-size: 12px; color: #5e6b64"><span style="font-weight: 700; color: #0b2e3f">B</span>frame 7</figcaption>
</figure>
</div>

<div style="display: flex; flex-direction: column; gap: 6px; padding: 12px 14px; border-radius: 12px; background: #eef1f2; font-size: 14px">
<div style="display: flex; align-items: center; gap: 8px"><span style="font-weight: 700; color: #0b2e3f; width: 14px">A</span><span title="Reference plane carried from an earlier run (not blocking)" style="padding: 2px 8px; border-radius: 4px; background: #fbf1de; color: #5a3e00; font-size: 12px; font-weight: 700">ref carried</span><span style="color: #4a565d">3 frames</span></div>
<div style="display: flex; align-items: center; gap: 8px"><span style="font-weight: 700; color: #0b2e3f; width: 14px">B</span><span style="padding: 2px 8px; border-radius: 4px; background: #ffffff; border: 1px solid #1c7293; color: #1c7293; font-size: 12px; font-weight: 700">QC pass</span><span style="color: #4a565d">3 frames</span></div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 8px">
<a href="Profile.dc.html" style="min-height: 44px; display: inline-flex; align-items: center; padding: 0 16px; border-radius: 8px; background: #1c7293; color: #ffffff; font-weight: 700; text-decoration: none">Plant profile</a>
<a href="Traits.dc.html" style="min-height: 44px; display: inline-flex; align-items: center; padding: 0 16px; border-radius: 8px; border: 1px solid #1c7293; color: #1c7293; font-weight: 700; text-decoration: none; box-sizing: border-box">Trait explorer</a>
</div>
</aside>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1180}}'>
class Component extends DCLogic {
state = { mode: 'height', compare: true, hour: 15 };

renderVals() {
const { mode, compare, hour } = this.state;
const IMG = {
  height: ['/_blob/3d397144f737860a2bab61297c05e425', '/_blob/0593a4930a398f127c8a359b005a6009'],
  rgb: ['/_blob/9f3439ac32f8cc82cc400071d20be951', '/_blob/63572cef53e7b78ced64fda8685afe9d'],
};
const S = {"6":[94.1,98.5,99.7,111.6,113.1,119.6,null,null,101.8,149.6,141.6,128.2,74.6,61.9,52.3,39.3,null,38.7],"9":[81.4,100.8,109.0,95.3,102.3,104.9,120.8,115.0,125.0,null,36.7,137.3,68.2,48.3,49.4,35.2,null,34.9],"12":[74.4,74.4,80.6,100.8,98.4,108.8,113.1,123.6,null,115.4,131.6,97.0,61.0,45.9,44.1,28.3,29.9,46.5],"15":[70.7,95.8,73.8,102.7,105.8,104.9,121.3,109.0,130.3,102.0,127.8,78.1,60.7,41.2,38.5,33.8,39.3,47.4],"18":[73.2,80.7,79.3,54.5,104.1,114.9,113.0,116.3,79.7,98.8,124.3,63.5,47.9,43.0,28.4,27.3,26.3,64.5]};
const P = {"6":[true,true,true,true,true,true,null,null,false,true,true,true,true,true,true,true,false,false],"9":[false,true,true,false,true,true,true,true,true,null,true,true,false,true,true,true,false,true],"12":[true,false,false,true,true,true,true,true,null,false,true,true,true,true,true,true,true,false],"15":[false,true,true,true,true,true,true,true,true,true,true,true,true,false,true,true,false,true],"18":[false,true,true,true,true,true,true,true,false,true,true,true,true,true,true,true,true,true]};
const x = (i) => 40 + i * 48, y = (v) => (200 - v * 1.15).toFixed(1);
const line = (h) => { let d = ''; S[h].forEach((v, i) => { if (v != null && P[h][i]) d += (d ? ' L' : 'M') + x(i) + ' ' + y(v); }); return d; };
const dots = (h) => S[h].map((v, i) => (v != null && P[h][i] ? 'M' + x(i) + ' ' + y(v) + ' h0.01' : '')).join(' ');
let fails = '';
Object.keys(S).forEach((h) => S[h].forEach((v, i) => { if (v != null && P[h][i] === false) { const X = x(i), Y = +y(v); fails += 'M' + (X - 4) + ' ' + (Y - 4) + ' L' + (X + 4) + ' ' + (Y + 4) + ' M' + (X - 4) + ' ' + (Y + 4) + ' L' + (X + 4) + ' ' + (Y - 4) + ' '; } }));
const others = Object.keys(S).filter((h) => +h !== hour).map(line).join(' ');

const btn = (on) => ({ bg: on ? '#1c7293' : '#f6f8f9', fg: on ? '#ffffff' : '#1e2a24', bd: on ? '#1c7293' : '#8a959c' });
const modes = [
  { id: 'height', label: 'Height', tip: 'Plant points by height above soil' },
  { id: 'rgb', label: 'RGB', tip: 'Camera colour' },
  { id: 'temp', label: 'Temp', tip: 'No thermal values in this cloud', off: true },
].map((m) => ({ ...m, on: mode === m.id, ...btn(mode === m.id), fg: m.off ? '#8a959c' : mode === m.id ? '#ffffff' : '#1e2a24', pick: m.off ? undefined : () => this.setState({ mode: m.id }) }));

const hrs = (list) => list.map((h) => ({ h, ...(h === 15 ? { bg: '#0b2e3f', fg: '#ffffff', bd: '#0b2e3f' } : { bg: '#ffffff', fg: '#1e2a24', bd: '#cfe0d4' }) }));
const all = [
  { tag: 'A', day: 'Day −1', date: '2 Sep · 15 h', hours: hrs([6, 7, 9, 12, 15, 18, 19]), img: IMG[mode === 'rgb' ? 'rgb' : 'height'][0], pts: '11,886 pts', plantPts: '3,794 plant', tint: '#eef4ee', alt: 'Point cloud of W2 A8 on 2 Sep at 15 h', aria: 'View A' },
  { tag: 'B', day: 'Day 10', date: '13 Sep · 15 h', hours: hrs([6, 7, 9, 12, 15, 18]), img: IMG[mode === 'rgb' ? 'rgb' : 'height'][1], pts: '10,654 pts', plantPts: '671 plant', tint: '#fbf1de', alt: 'Point cloud of W2 A8 on 13 Sep at 15 h', aria: 'View B' },
];

const T = [
  ['Height p75', 'mm', 102.7, 0.5, 38.5, 0.3, 1],
  ['Projected area', 'cm²', 128.3, 4.9, 33.1, 1.8, 1],
  ['Leaf area', 'cm²', 232.7, 1.2, 70.5, 4.0, 1],
  ['Hull volume', 'cm³', 2257, 27, 456, 2, 0],
  ['Canopy radius', 'mm', 81.9, 0.3, 82.4, 0.2, 1],
  ['Droop index', '', 0.621, 0.006, 0.407, 0.029, 3],
  ['Inclination', '°', 47.7, 0.4, 49.1, 1.8, 1],
];
const fmt = (v, dp) => v.toLocaleString('en-US', { minimumFractionDigits: dp, maximumFractionDigits: dp });
const traits = T.map(([label, unit, a, ma, b, mb, dp]) => {
  const pct = Math.round((b / a - 1) * 100);
  return { label, unit, a: fmt(a, dp), b: fmt(b, dp), madA: '± ' + fmt(ma, dp) + ' MAD', madB: '± ' + fmt(mb, dp) + ' MAD', tip: 'Median over frames ± MAD',
    d: (pct > 0 ? '+' : pct < 0 ? '−' : '') + Math.abs(pct) + '%', dc: Math.abs(pct) < 5 ? '#5e6b64' : pct < 0 ? '#5a3e00' : '#1c7293' };
});

return {
  modes, compare,
  toggleCompare: () => this.setState({ compare: !compare }),
  cmpBg: compare ? '#0b2e3f' : '#f6f8f9', cmpFg: compare ? '#ffffff' : '#1e2a24', cmpBd: compare ? '#0b2e3f' : '#8a959c',
  views: compare ? all : [all[1]], cols: compare ? 'repeat(2, minmax(0, 1fr))' : 'minmax(0, 1fr)',
  showRamp: mode === 'height',
  hourBtns: [6, 9, 12, 15, 18].map((h) => ({ h, on: h === hour, ...btn(h === hour), pick: () => this.setState({ hour: h }) })),
  others, fails, sel: line(hour), selDots: dots(hour),
  chartAria: 'Height p75 of W2 A8 from 30 Aug to 16 Sep, ' + hour + ' h highlighted',
  traits,
};
}
}
</script>
</body>
</html>
