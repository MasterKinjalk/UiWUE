[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "uiwue"
version = "0.1.0"
description = "Trait extraction and water-deficit stress analysis for the ADA 2025 sugar beet dataset"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = ["C408"]   # dict(...) is the idiom in Plotly layouts
