[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uiwue"
version = "0.1.0"
description = "UiWUE: water-deficit stress analysis tools for the ADA 2025 sugar beet dataset"
requires-python = ">=3.12"
dynamic = ["dependencies", "optional-dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }
optional-dependencies.ml = { file = ["requirements-ml.txt"] }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["external", "data", "models", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long docstring / comment lines; `ruff format` wraps code at 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
